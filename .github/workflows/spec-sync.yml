name: Spec Sync

# Receiver side of the cross-repo spec flow (design D10).
#
# The single source of truth for the public OpenAPI spec lives in the private
# `factuarea` repo and is published at a stable URL. This workflow keeps the
# pinned copy in `spec/openapi.json` (and the generated layer) up to date:
#
#   • repository_dispatch (event_type: spec-updated) — pushed by the `factuarea`
#     CI when the public spec is republished. The emitter is the `SDK Spec
#     Dispatch` workflow in that repo (wired 2026-08-06); see docs/SPEC_SYNC.md.
#     This trigger stays ACTIVE here, but the emitter's own tag trigger is
#     PAUSED (see the note below), so a dispatch now only arrives when someone
#     runs that workflow by hand.
#   • workflow_dispatch — manual trigger.
#   • schedule (daily) — fallback if the dispatch never arrives. PAUSED on
#     2026-09-22; the note below states the checkable condition to restore it.
#
# When the published spec differs CANONICALLY from the committed copy (parsed
# JSON, key-order/whitespace-insensitive, x-codeSamples ignored — see
# scripts/spec-sync.mjs) the spec is updated, the SDK is regenerated, and a PR
# is opened with an auto changeset. It NEVER pushes to main directly.
#
# `schedule` restored 2026-08-06: published spec 345 paths vs 192 pinned, which
# satisfies the `docs == prod` condition it was paused under on 2026-06-07.
#
# `schedule` PAUSED again 2026-09-22 by the company-axis wave, which re-anchors
# every company resource under /companies/{company}/… and pins a document that
# production does not serve yet. With the schedule live, the daily run would
# download the PRODUCTION document and open a pull request that UNDOES the axis
# in this SDK, and no gate would notice.
#
# The reactivation condition is deliberately NOT an operation count: a condition
# written as a number is false the day someone reads it. Identity of the two
# documents is what decides.
#
# PAUSED schedule since 2026-09-22; reactivate when: the spec published at $SPEC_URL and the copy
# pinned in this repo are CANONICALLY identical — parse both, sort object keys recursively, drop
# x-codeSamples, serialize without whitespace (scripts/spec-sync.mjs `canonicalize`) and compare the two
# sha256 digests; equal ⇒ restore the block verbatim, different ⇒ it stays paused.
# The same pause, with this same condition word for word, is in force in factuarea-node (this
# file) and in factuarea-php; the emitter in the private `factuarea` repo
# (.github/workflows/sdk-spec-dispatch.yml) is paused too. All three are
# restored together, and only against this condition.
#
# Anyone can check that with no context, because this repo ships the procedure:
#
#   curl -fsSL "https://docs.factuarea.com/api/openapi" -o /tmp/published.json
#   node scripts/spec-sync.mjs check /tmp/published.json   # changed=false ⇒ identical ⇒ restore
#
# Both sides must go through THAT procedure. A digest produced any other way —
# raw bytes, or a sort that orders integer-like keys differently, as Python's
# json.dumps(sort_keys=True) does — is not comparable, and reads as drift on a
# document that is in fact identical.
#
# The pause is in force in THREE places, because pausing only the two receivers
# would not have been enough:
#   • factuarea-node — this file: `schedule`.
#   • factuarea-php — .github/workflows/spec-sync.yml: the same `schedule`,
#     carrying this same condition word for word.
#   • factuarea (the private backend repo) — .github/workflows/sdk-spec-dispatch.yml:
#     its `push: tags: v*` trigger. That emitter dispatches `spec-updated` to
#     factuarea-node AND factuarea-php on every release tag, and a release
#     unrelated to this work would be enough for both receivers to download the
#     PRODUCTION document with their own `schedule` already off.
# `repository_dispatch` here stays ACTIVE on purpose: with `schedule` paused it
# is the only unattended trigger left, and test/spec-sync.test.ts ("keeps at
# least one unattended trigger active") fails if it goes too. With the emitter
# paused, it can now only be fired by hand.
#
# Condition met ⇒ put the block back under `on:`, exactly as it was:
#
#   schedule:
#     - cron: "17 6 * * *" # daily at 06:17 UTC
#
# Condition not met ⇒ it stays paused. Nothing was disabled from the Actions
# UI: that leaves no trace in the repo, is not reviewed in a PR and does not
# survive a restore. Reactivating is the repository owner's call.

on:
  repository_dispatch:
    types: [spec-updated]
  workflow_dispatch:

permissions:
  contents: write # create the sync branch
  pull-requests: write # open the sync PR

env:
  # The published spec URL is FIXED to the official endpoint and is NOT
  # overridable from the event payload. A repository_dispatch is only a "go
  # regenerate" signal; allowing client_payload.spec_url to set the URL would
  # let any dispatch point CI at an attacker-controlled spec that is then
  # downloaded, regenerated into code, and executed (RCE in CI).
  SPEC_URL: "https://docs.factuarea.com/api/openapi"

jobs:
  sync:
    name: Sync spec & regenerate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Download published spec
        run: |
          echo "Fetching spec from $SPEC_URL"
          curl -fsSL "$SPEC_URL" -o /tmp/published-spec.json
          # Fail early if the URL returned something that is not JSON.
          node -e "JSON.parse(require('fs').readFileSync('/tmp/published-spec.json','utf8'))" \
            || (echo "::error::Published spec at $SPEC_URL is not valid JSON." && exit 1)

      - name: Canonically compare published vs committed spec
        id: diff
        run: node scripts/spec-sync.mjs check /tmp/published-spec.json

      - name: No change — nothing to do
        if: steps.diff.outputs.changed != 'true'
        run: echo "Published spec matches the committed copy (canonical). Nothing to sync."

      - name: Apply new spec & regenerate
        if: steps.diff.outputs.changed == 'true'
        run: |
          node scripts/spec-sync.mjs apply /tmp/published-spec.json
          npm run generate
          npm run typecheck
          npm run build
          npm test

      - name: Write changeset
        if: steps.diff.outputs.changed == 'true'
        run: |
          mkdir -p .changeset
          BUMP="${{ steps.diff.outputs.bump }}"
          ADDED="${{ steps.diff.outputs.added_ops }}"
          REMOVED="${{ steps.diff.outputs.removed_ops }}"
          cat > .changeset/spec-sync.md <<EOF
          ---
          "@factuarea/sdk": ${BUMP}
          ---

          Regenerate the SDK from an updated public OpenAPI spec
          (+${ADDED} operations, -${REMOVED} operations).

          > Auto-generated by the Spec Sync workflow. While the SDK is in
          > \`0.x\`, a removed or renamed operation stays a \`minor\` and
          > \`1.0.0\` remains reserved for the API's GA (docs/VERSIONING.md).
          > Name the replacement of every removed operation here before merging.
          EOF
          echo "Wrote .changeset/spec-sync.md (${BUMP})"

      - name: Open sync PR
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          branch: spec-sync/update
          base: main
          commit-message: "chore(spec): sync OpenAPI spec & regenerate"
          title: "chore(spec): sync OpenAPI spec & regenerate (+${{ steps.diff.outputs.added_ops }}/-${{ steps.diff.outputs.removed_ops }} ops)"
          labels: spec-sync
          body: |
            The published OpenAPI spec changed; this PR re-pins
            `spec/openapi.json` and regenerates `src/generated/` and
            `src/resources/`.

            - Added operations: **${{ steps.diff.outputs.added_ops }}**
            - Removed operations: **${{ steps.diff.outputs.removed_ops }}**
            - Proposed bump: **${{ steps.diff.outputs.bump }}** (see the changeset)

            Review the diff. In `0.x` a removed or renamed operation is still a
            `minor` — `1.0.0` is reserved for the API's GA — so name each removed
            operation's replacement in `.changeset/spec-sync.md` instead of
            promoting the bump. Merging this PR feeds the Changesets release flow
            (see the Release workflow).
          author: "Factuarea <info@factuarea.com>"
          committer: "Factuarea <info@factuarea.com>"
